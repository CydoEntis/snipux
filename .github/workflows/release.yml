# Pushing a v* tag publishes that version: the wheel and sdist go to PyPI
# and onto the GitHub Release. Releasing was a person typing commands
# before this, which is fine for one person and nothing else.
#
# No API token is stored. PyPI's trusted publishing verifies the workflow's
# own OIDC identity (repository, workflow file, ref), which is why the
# `id-token: write` permission below is load-bearing rather than
# boilerplate -- and why the PyPI side has to name this file exactly.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in pyproject.toml
        # A tag that disagrees with the package version publishes something
        # nobody can install by the name they were given.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  linux_artifacts:
    # After the release exists, and unable to stop it: this job builds the
    # two Linux artifacts on a runner, and a release that is otherwise
    # complete must not be held back by a packaging step failing. A failure
    # here leaves the wheel, the sdist and the GitHub release in place, with
    # the .deb and the AppImage to add by hand or on a re-run.
    needs: [build, github_release]
    continue-on-error: true
    permissions:
      contents: write        # to attach the artifacts to the release
    # 22.04, not ubuntu-latest, and deliberately: PyInstaller links whatever
    # glibc the build machine has, and glibc is forward- but not
    # backward-compatible. An artifact built on a newer runner refuses to
    # start on the oldest release snipux claims to support (CLAUDE.md:
    # Ubuntu 22.04+) with a bare "GLIBC_2.38 not found". Building on the
    # floor is what makes one file work everywhere above it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's own runtime libraries, needed at *build* time here rather than
      # test time: PyInstaller can only bundle a library it can find, so
      # anything missing on this runner is missing from the artifact and
      # fails on the user's machine instead (build_bundle.sh preflights
      # libxcb-cursor for exactly this reason).
      - name: Install Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                  libpulse0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
                                  libxcb-cursor0

      - name: Build the AppImage
        run: ./packaging/linux/build_appimage.sh

      - name: Build the .deb
        run: ./packaging/linux/build_deb.sh

      # A smoke test worth more than it looks: --list-backends builds the
      # real capture and recording registries out of the real bundle, so the
      # interpreter, PyQt6 and the design assets all have to have resolved
      # through sys._MEIPASS for it to print anything. A bundle missing any
      # of them fails here rather than on the first person to download it.
      # Offscreen because the runner has no display, the same way the suite
      # runs (CLAUDE.md).
      - name: Check the bundle runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/snipux/snipux --list-backends

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb             --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # what trusted publishing authenticates with
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the files to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the release with the files on it
        env:
          GH_TOKEN: ${{ github.token }}
        # Create it when the tag has no release yet -- pushing a tag alone
        # does not make one, which is how the first run of this workflow
        # failed with "release not found" after PyPI had already accepted
        # the upload.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes               --title "snipux ${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"
          fi
