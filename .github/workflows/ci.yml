# Every push and pull request, on both platforms snipux claims to support.
# The suite is headless by design (CLAUDE.md): conftest.py defaults
# QT_QPA_PLATFORM to offscreen, so no display is needed here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 needs these even for the offscreen platform plugin: it still
      # loads the Qt platform abstraction, which links EGL and xkbcommon.
      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest -q
