# Every push and pull request, on both platforms snipux claims to support.
# The suite is headless by design (CLAUDE.md): conftest.py defaults
# QT_QPA_PLATFORM to offscreen, so no display is needed here.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        scale: ["1"]
        # Fractional scaling is where a value used in the wrong coordinate
        # space shows, and a 1.0 run hides it -- so the suite has to stay
        # green at 1.5 too (CONTRIBUTING.md). Ubuntu only: it is the faster
        # runner, and the scaling code is the same Qt on both. `scale` has
        # to be a matrix axis for this to be a job of its own: an include
        # that only adds a key is merged into the matching job instead.
        include:
          - os: ubuntu-latest
            python: "3.12"
            scale: "1.5"
    runs-on: ${{ matrix.os }}
    env:
      QT_SCALE_FACTOR: ${{ matrix.scale }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 needs these even for the offscreen platform plugin: it still
      # loads the Qt platform abstraction, which links EGL and xkbcommon.
      # libpulse and GStreamer come with QtMultimedia, which capture.py
      # pulls in on every platform -- without them the import fails before
      # a single test runs.
      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3                                   libpulse0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest -q
