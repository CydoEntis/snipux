[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipux"
version = "0.2.0"
description = "A Windows Snipping Tool workalike for Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cody", email = "cydoentis@gmail.com" },
]
keywords = ["screenshot", "snipping-tool", "wayland", "gnome", "linux", "annotation"]
# Trove classifiers PyPI renders on the project page. They are metadata and
# nothing else -- documentation for a human reading the project page.
#
# An earlier version of this comment claimed the OS classifier was
# "load-bearing": that it stopped pip/pipx offering this on Windows. It does
# not, and never did. pip does not read classifiers when deciding what to
# install; only `requires-python` and wheel tags gate anything, and this is a
# pure-Python `py3-none-any` wheel. Measured: the wheel installs cleanly into
# a Windows venv and puts a `snipux` launcher on PATH, classifier and all.
# That is now the wanted behaviour anyway -- Windows is a target platform
# (SNX-85/86), and shipping someone the wheel is the install route that
# Smart App Control cannot block, because pip generates the launcher locally
# from an already-trusted python.exe rather than the user downloading a new
# unsigned executable. See the README's "Sending it to someone else".
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Utilities",
]
# Matches requirements.txt's two runtime packages. pytest stays a
# dev/test-only dependency -- no snipux/*.py module imports it.
dependencies = [
    # >=6.8: QVideoFrameInput (SNX-118's Windows region-recording path) is
    # a Qt 6.8 addition -- see requirements.txt for the same floor.
    "PyQt6>=6.8",
    "jeepney>=0.8",
]

[project.optional-dependencies]
# Build-only (SNX-96): PyInstaller bundles the interpreter, PyQt6 and
# snipux itself into packaging/windows/snipux.spec's standalone Windows
# executable. Nothing under snipux/ imports it, and it is deliberately an
# extra rather than a `dependencies` entry, or an addition to
# requirements.txt, so a plain `pip install snipux` and the
# `pip install -r requirements.txt` the test suite runs never pull it in --
# only `packaging/windows/build.ps1` does, via `pip install .[build-windows]`.
build-windows = ["pyinstaller>=6.5"]

[project.urls]
Homepage = "https://github.com/CydoEntis/snipux"
Repository = "https://github.com/CydoEntis/snipux"
Issues = "https://github.com/CydoEntis/snipux/issues"

[project.scripts]
snipux = "snipux.app:cli"

[tool.pytest.ini_options]
# "-ra" keeps skip reasons (and their count) in the summary on every run,
# `-q` included -- SNX-84: a platform gap that only shows up with an extra
# flag someone has to remember reads as full coverage.
addopts = "-ra"

[tool.setuptools.packages.find]
# An explicit list ("snipux") silently drops subpackages added later --
# that is exactly how snipux.design shipped without ever being installed.
# Finding by pattern instead means a future snipux.<whatever> needs no
# packaging change to be picked up.
include = ["snipux", "snipux.*"]

[tool.setuptools.package-data]
# icons/*.svg are read at runtime by design/__init__.py via Path(__file__),
# not imported as modules, so they must be declared as data or they never
# make it into the install. fonts/*.ttf and *.otf are listed the same way
# even though design/fonts/ is empty in this handoff -- vendoring IBM Plex
# later should need no packaging change, only dropping the files in.
# logo/*.png is the same story, read at runtime by app.py's load_app_icon()
# and setup_desktop.py's install_icons() -- SNX-81: this is exactly the
# mistake SNX-56 had to fix for icons/*.svg, so the new logo assets are
# declared here from the start rather than repeating it.
"snipux.design" = ["icons/*.svg", "fonts/*.ttf", "fonts/*.otf", "logo/*.png"]
# snipux.desktop is read at runtime by setup_desktop.py via Path(__file__),
# the same pattern as design/icons above -- SNX-73: this is what lets
# `snipux --setup` write a real .desktop entry from an installed wheel with
# no repository checkout present.
"snipux" = ["snipux.desktop"]
