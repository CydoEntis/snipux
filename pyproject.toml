[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipux"
version = "0.1.0"
description = "A Windows Snipping Tool workalike for Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Matches requirements.txt's two runtime packages. pytest stays a
# dev/test-only dependency -- no snipux/*.py module imports it.
dependencies = [
    "PyQt6>=6.5",
    "jeepney>=0.8",
]

[project.scripts]
snipux = "snipux.app:cli"

[tool.setuptools.packages.find]
# An explicit list ("snipux") silently drops subpackages added later --
# that is exactly how snipux.design shipped without ever being installed.
# Finding by pattern instead means a future snipux.<whatever> needs no
# packaging change to be picked up.
include = ["snipux", "snipux.*"]

[tool.setuptools.package-data]
# icons/*.svg are read at runtime by design/__init__.py via Path(__file__),
# not imported as modules, so they must be declared as data or they never
# make it into the install. fonts/*.ttf and *.otf are listed the same way
# even though design/fonts/ is empty in this handoff -- vendoring IBM Plex
# later should need no packaging change, only dropping the files in.
"snipux.design" = ["icons/*.svg", "fonts/*.ttf", "fonts/*.otf"]
# snipux.desktop is read at runtime by setup_desktop.py via Path(__file__),
# the same pattern as design/icons above -- SNX-73: this is what lets
# `snipux --setup` write a real .desktop entry from an installed wheel with
# no repository checkout present.
"snipux" = ["snipux.desktop"]
