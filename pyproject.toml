[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipux"
version = "0.1.0"
description = "A Windows Snipping Tool workalike for Linux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Matches requirements.txt's two runtime packages. pytest stays a
# dev/test-only dependency -- no snipux/*.py module imports it.
dependencies = [
    "PyQt6>=6.5",
    "jeepney>=0.8",
]

[project.scripts]
snipux = "snipux.app:cli"

[tool.setuptools]
packages = ["snipux"]
